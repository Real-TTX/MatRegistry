# MatRegistry - Development (branch dev, image :nightly) with pgAdmin
#   docker compose -f docker-compose.dev.yml up -d
#   App:     http://localhost:4780
#   pgAdmin: http://localhost:4781   (no sign-in; database password: matregistry)
name: matregistry-dev

services:
  web:
    image: ghcr.io/real-ttx/matregistry:nightly
    restart: unless-stopped
    ports:
      - "4780:4780"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matregistry
      POSTGRES_USER: matregistry
      POSTGRES_PASSWORD: matregistry
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matregistry -d matregistry"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "4781:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matregistry.example.com
      PGADMIN_DEFAULT_PASSWORD: matregistry
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "MatRegistry", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "matregistry", "Username": "matregistry", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:
